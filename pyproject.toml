[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-to-reset"
version = "0.1.0"
description = "Research scaffold for context cleaning in mathematical reasoning."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Learning to Reset contributors" }
]

[project.optional-dependencies]
trainer = [
  "transformers",
  "datasets",
  "accelerate",
  "torch",
  "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
